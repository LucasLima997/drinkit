<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Checkout</title>
  </head>
  <body>
    <h1>Simulated Checkout</h1>

    <p>This is a simulated checkout. No real payment will be processed.</p>

    <h2>Order Summary</h2>

    <div th:each="item : ${cartItems}">
      <hr />
      <h3 th:text="${item.product.name}">Product Name</h3>
      <p>
        Quantity:
        <span th:text="${item.quantity}">1</span>
      </p>
      <p>
        Subtotal: €
        <span th:text="${item.subtotal}">0.00</span>
      </p>
    </div>

    <hr />

    <h2>Total: €<span th:text="${total}">0.00</span></h2>

    <h2>Customer Details</h2>

    <form method="post" action="/checkout">
      <input
        type="hidden"
        th:name="${_csrf.parameterName}"
        th:value="${_csrf.token}"
      />

      <label>Name:</label>
      <br />
      <input type="text" name="customerName" required />
      <br /><br />

      <label>Email:</label>
      <br />
      <input type="email" name="customerEmail" required />
      <br /><br />

      <label>Delivery Address:</label>
      <br />
      <textarea name="deliveryAddress" required></textarea>
      <br /><br />

      <button type="submit">Confirm Order</button>
    </form>

    <br />

    <a href="/cart">Back to Cart</a>
  </body>
</html>
