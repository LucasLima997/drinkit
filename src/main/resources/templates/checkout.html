<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="app-shell checkout-page">
      <div class="brand-bar detail-brand">
        <img
          src="/images/drinkit-logo.png"
          alt="DrinKit Logo"
          class="brand-logo detail-logo"
        />

        <div class="brand-text">
          <h1 class="brand-name detail-brand-name">DrinKit</h1>
        </div>
      </div>

      <div class="checkout-top">
        <a href="/cart" class="back-link">‹ Cart</a>
        <h1>Checkout</h1>
      </div>

      <div class="checkout-note">Simulated checkout only. No real payment.</div>

      <div class="checkout-items-card">
        <div class="checkout-section-title">Items</div>

        <div class="checkout-item" th:each="item : ${cartItems}">
          <img
            class="checkout-item-image"
            th:src="${item.product.imageUrl}"
            alt="Product image"
          />

          <div class="checkout-item-info">
            <div class="checkout-item-title" th:text="${item.product.name}">
              Product Name
            </div>

            <div class="checkout-item-meta">
              Qty: <span th:text="${item.quantity}">1</span>
            </div>

            <div class="checkout-item-price">
              €<span th:text="${item.subtotal}">0.00</span>
            </div>
          </div>
        </div>
      </div>

      <form method="post" action="/checkout" class="checkout-form-card">
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />

        <input
          class="checkout-input"
          type="text"
          name="customerName"
          placeholder="Name"
          required
        />

        <input
          class="checkout-input"
          type="email"
          name="customerEmail"
          placeholder="Email"
          required
        />

        <textarea
          class="checkout-textarea"
          name="deliveryAddress"
          placeholder="Shipping address"
          required
        ></textarea>

        <div class="checkout-summary">
          <div class="summary-row">
            <span>Shipping</span>
            <strong>Free</strong>
          </div>

          <div class="summary-total">
            <span>Total</span>
            <strong>€<span th:text="${total}">0.00</span></strong>
          </div>
        </div>

        <button type="submit" class="checkout-button">Place order</button>
      </form>

      <div class="bottom-nav">
        <a href="/">⌂</a>
        <a href="/products">🍹</a>
        <a href="/cart">🛒</a>
        <a href="/products">♡</a>
        <a href="/">◠</a>
      </div>
    </div>
  </body>
</html>
