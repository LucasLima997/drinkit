<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Product</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="app-shell admin-page">
      <div class="brand-bar detail-brand">
        <img
          src="/images/drinkit-logo.png"
          alt="DrinKit Logo"
          class="brand-logo detail-logo"
        />

        <div class="brand-text">
          <h1 class="brand-name detail-brand-name">DrinKit</h1>
        </div>
      </div>

      <a href="/admin/products" class="back-link">‹ Admin</a>

      <h1 class="admin-title">Add Product</h1>

      <form method="post" action="/admin/products" class="checkout-form-card">
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />

        <input
          class="checkout-input"
          type="text"
          name="name"
          placeholder="Product name"
          required
        />

        <textarea
          class="checkout-textarea"
          name="description"
          placeholder="Description"
          required
        ></textarea>

        <input
          class="checkout-input"
          type="number"
          step="0.01"
          name="price"
          placeholder="Price"
          required
        />

        <input
          class="checkout-input"
          type="text"
          name="category"
          placeholder="Category"
          required
        />

        <input
          class="checkout-input"
          type="text"
          name="imageUrl"
          placeholder="/images/mojito.jpg"
          required
        />

        <label class="admin-checkbox">
          <input type="checkbox" name="alcoholic" value="true" />
          Alcoholic product
        </label>

        <button type="submit" class="checkout-button">Save Product</button>
      </form>
    </div>
  </body>
</html>
