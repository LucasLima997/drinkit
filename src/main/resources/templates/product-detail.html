<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Details</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="app-shell detail-page">
      <div class="brand-bar detail-brand">
        <img src="/images/drinkit-logo.png" alt="DrinKit Logo" class="brand-logo detail-logo" />

        <div class="brand-text">
          <h1 class="brand-name detail-brand-name">DrinKit</h1>
        </div>
      </div>

      <a href="/products" class="back-link">‹ Back to Products</a>

      <div class="detail-image-wrapper compact-detail-image portrait-drink-image">
        <img
          class="detail-image"
          th:src="${product.imageUrl}"
          alt="Product image"
        />
      </div>

      <div class="detail-card compact-detail-card product-info-compact">
        <h1 class="detail-title compact-detail-title" th:text="${product.name}">
          Product Name
        </h1>

        <p class="detail-description compact-detail-description" th:text="${product.description}">
          Product description
        </p>

        <div class="responsible-box" th:if="${product.alcoholic}">
          Drink responsibly.
        </div>

        <div class="responsible-box mocktail-box" th:unless="${product.alcoholic}">
          Non-alcoholic mocktail kit.
        </div>

        <div class="compact-buy-row">
          <div class="detail-price">
            €<span th:text="${product.price}">0.00</span>
          </div>

          <a th:href="@{/cart/add/{id}(id=${product.id})}" class="compact-cart-button">
            Add to Cart
          </a>
        </div>
      </div>

      <div class="bottom-nav">
        <a href="/">⌂</a>
        <a href="/products">🍹</a>
        <a href="/cart">🛒</a>
        <a href="/products">♡</a>
        <a href="/">◠</a>
      </div>
    </div>
  </body>
</html>
