<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Confirmation</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="app-shell confirmation-page">
      <div class="brand-bar detail-brand">
        <img
          src="/images/drinkit-logo.png"
          alt="DrinKit Logo"
          class="brand-logo detail-logo"
        />

        <div class="brand-text">
          <h1 class="brand-name detail-brand-name">DrinKit</h1>
        </div>
      </div>

      <div class="confirmation-card">
        <div class="confirmation-icon">✓</div>

        <h1>Order Confirmed</h1>

        <p>Your simulated order has been placed successfully.</p>

        <div class="order-pill">
          Order #<span th:text="${order.id}">1</span>
        </div>
      </div>

      <div class="confirmation-info-card">
        <div class="info-row">
          <span>Name</span>
          <strong th:text="${order.customerName}">Customer Name</strong>
        </div>

        <div class="info-row">
          <span>Email</span>
          <strong th:text="${order.customerEmail}">email@example.com</strong>
        </div>

        <div class="info-row">
          <span>Status</span>
          <strong th:text="${order.status}">CONFIRMED</strong>
        </div>
      </div>

      <div class="checkout-items-card">
        <div class="checkout-section-title">Items</div>

        <div class="checkout-item" th:each="item : ${order.items}">
          <div class="checkout-item-info">
            <div class="checkout-item-title" th:text="${item.productName}">
              Product Name
            </div>

            <div class="checkout-item-meta">
              Qty: <span th:text="${item.quantity}">1</span>
            </div>

            <div class="checkout-item-price">
              €<span th:text="${item.subtotal}">0.00</span>
            </div>
          </div>
        </div>

        <div class="summary-total confirmation-total">
          <span>Total</span>
          <strong>€<span th:text="${order.totalPrice}">0.00</span></strong>
        </div>
      </div>

      <a
        th:href="@{/orders/{id}/guides(id=${order.id})}"
        class="primary-button"
      >
        Access Digital Guides
      </a>

      <a href="/products" class="secondary-button"> Continue Shopping </a>

      <div class="bottom-nav">
        <a href="/">⌂</a>
        <a href="/products">🍹</a>
        <a href="/cart">🛒</a>
        <a href="/products">♡</a>
        <a href="/">◠</a>
      </div>
    </div>
  </body>
</html>
