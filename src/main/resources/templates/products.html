<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>DrinKit Products</title>
  </head>
  <body>
    <h1>DrinKit Products</h1>
    <p>Browse our cocktail and mocktail kits.</p>

    <div th:each="product : ${products}">
      <hr />

      <h2 th:text="${product.name}">Product Name</h2>

      <p th:text="${product.description}">Product description</p>

      <p>
        <strong>Category:</strong>
        <span th:text="${product.category}">Category</span>
      </p>

      <p>
        <strong>Price:</strong>
        €<span th:text="${product.price}">0.00</span>
      </p>

      <p th:if="${product.alcoholic}">
        Contains alcohol. Please drink responsibly.
      </p>

      <p th:unless="${product.alcoholic}">Non-alcoholic mocktail kit.</p>

      <a th:href="@{/products/{id}(id=${product.id})}">View Details</a>
    </div>

    <br />
    <a href="/">Back to Home</a>
  </body>
</html>
