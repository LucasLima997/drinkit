<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Guide</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="app-shell guide-detail-page">
      <div class="brand-bar detail-brand">
        <img
          src="/images/drinkit-logo.png"
          alt="DrinKit Logo"
          class="brand-logo detail-logo"
        />

        <div class="brand-text">
          <h1 class="brand-name detail-brand-name">DrinKit</h1>
        </div>
      </div>

      <div class="guides-header">
        <a href="/products" class="back-link">‹ Products</a>
        <h1>Guide</h1>
      </div>

      <div class="guide-product-card">
        <img
          class="guide-product-image"
          th:src="${product.imageUrl}"
          alt="Product image"
        />

        <div>
          <div class="guide-product-title" th:text="${product.name}">
            Product Name
          </div>

          <div class="guide-product-meta">Digital preparation guide</div>
        </div>
      </div>

      <div class="guide-image-card">
        <img
          th:if="${#strings.containsIgnoreCase(product.name, 'Virgin')}"
          src="/images/guide_virgin_mojito.png"
          alt="Virgin Mojito Guide"
          class="guide-png-image"
        />

        <img
          th:if="${#strings.containsIgnoreCase(product.name, 'Margarita')}"
          src="/images/guide_margarita.png"
          alt="Margarita Guide"
          class="guide-png-image"
        />

        <img
          th:if="${#strings.containsIgnoreCase(product.name, 'Mojito') and !#strings.containsIgnoreCase(product.name, 'Virgin')}"
          src="/images/guide_mojito.png"
          alt="Mojito Guide"
          class="guide-png-image"
        />
      </div>

      <div class="guide-actions">
        <a th:href="@{/cart/add/{id}(id=${product.id})}" class="primary-button">
          Add Kit Again
        </a>

        <a href="/products" class="secondary-button"> Browse Products </a>
      </div>

      <div class="bottom-nav">
        <a href="/">⌂</a>
        <a href="/products">🍹</a>
        <a href="/cart">🛒</a>
        <a href="/products">♡</a>
        <a href="/">◠</a>
      </div>
    </div>
  </body>
</html>
