<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Guides</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="app-shell guides-page">
      <div class="brand-bar detail-brand">
        <img
          src="/images/drinkit-logo.png"
          alt="DrinKit Logo"
          class="brand-logo detail-logo"
        />

        <div class="brand-text">
          <h1 class="brand-name detail-brand-name">DrinKit</h1>
        </div>
      </div>

      <div class="guides-header">
        <a href="/products" class="back-link">‹ Products</a>
        <h1>My Guides</h1>
      </div>

      <div class="guides-order-card">
        <span>Order</span>
        <strong>#<span th:text="${order.id}">1</span></strong>
      </div>

      <div class="guides-list">
        <div class="guide-access-card" th:each="item : ${order.items}">
          <div class="guide-access-icon">🍹</div>

          <div class="guide-access-info">
            <div class="guide-access-title" th:text="${item.productName}">
              Product Name
            </div>

            <div class="guide-access-meta">Digital preparation guide</div>

            <a
              th:href="@{/guides/product/{id}(id=${item.productId})}"
              class="guide-open-button"
            >
              Open Guide
            </a>
          </div>
        </div>
      </div>

      <a href="/products" class="secondary-button"> Continue Shopping </a>

      <div class="bottom-nav">
        <a href="/">⌂</a>
        <a href="/products">🍹</a>
        <a href="/cart">🛒</a>
        <a href="/products">♡</a>
        <a href="/">◠</a>
      </div>
    </div>
  </body>
</html>
