<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Shopping Cart</title>
  </head>
  <body>
    <h1>Shopping Cart</h1>

    <div th:if="${#lists.isEmpty(cartItems)}">
      <p>Your cart is empty.</p>
      <a href="/products">Back to Products</a>
    </div>

    <div th:unless="${#lists.isEmpty(cartItems)}">
      <div th:each="item : ${cartItems}">
        <hr />

        <h2 th:text="${item.product.name}">Product Name</h2>

        <p>
          <strong>Quantity:</strong>
          <span th:text="${item.quantity}">1</span>
        </p>

        <p>
          <strong>Price:</strong>
          €<span th:text="${item.product.price}">0.00</span>
        </p>

        <p>
          <strong>Subtotal:</strong>
          €<span th:text="${item.subtotal}">0.00</span>
        </p>

        <a th:href="@{/cart/remove/{id}(id=${item.product.id})}">Remove</a>
      </div>

      <hr />

      <h2>Total: €<span th:text="${total}">0.00</span></h2>

      <a href="/cart/clear">Clear Cart</a>
      <br /><br />
      <a href="/products">Continue Shopping</a>
      <br /><br />
      <a href="/checkout">Proceed to Checkout</a>
    </div>
  </body>
</html>
